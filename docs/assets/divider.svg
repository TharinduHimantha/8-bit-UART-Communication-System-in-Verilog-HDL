<style>text{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono',monospace}</style></defs><path id="cb0" d="M0,14 H430 L444,6 H486 L500,14 H600 L614,22 H656 L670,14 H1100" fill="none" stroke="#00d4ff" stroke-opacity=".28" stroke-width="2" stroke-linejoin="round"/><path d="M0,14 H430 L444,6 H486 L500,14 H600 L614,22 H656 L670,14 H1100" fill="none" stroke="#00d4ff" stroke-opacity=".7" stroke-width="2" stroke-dasharray="2 18" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.4s" repeatCount="indefinite"/></path><g opacity="0"><circle r="3.2" fill="#00d4ff" filter="url(#glow)"/><animateMotion dur="5.0s" begin="0.0s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#cb0"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="5.0s" begin="0.0s" repeatCount="indefinite"/></g><path d="M550,14 l8,-8 l8,8 l-8,8 z" fill="#a066ff" filter="url(#glow)"><animate attributeName="opacity" values=".4;1;.4" dur="2.4s" repeatCount="indefinite"/></path></svg>

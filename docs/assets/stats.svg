;0" dur="2.6s" begin="1.2000000000000002s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0;.9" dur="2.6s" begin="1.2000000000000002s" repeatCount="indefinite"/></circle><rect x="890" y="14" width="200" height="122" rx="10" fill="#0b1730" stroke="#ff4586" stroke-width="1.4" stroke-opacity="0.7" /><rect x="890" y="14" width="200" height="122" rx="10" fill="#ff4586" fill-opacity="0.05" /><rect x="900" y="12.5" width="46" height="3" rx="1.5" fill="#ff4586" filter="url(#glow)"><animate attributeName="x" values="900;1034;900" dur="6.4s" repeatCount="indefinite"/></rect><text x="990.0" y="70" font-size="38" fill="#ff4586" text-anchor="middle" font-weight="bold" filter="url(#glow)">2,146</text><text x="990.0" y="96" font-size="13" fill="#d6e4ff" text-anchor="middle" font-weight="bold" >CHECKS PASSING</text><text x="990.0" y="116" font-size="10.5" fill="#7f93b8" text-anchor="middle" font-weight="normal" >fifo_tb + uart_core_tb</text><circle cx="906" cy="124" r="0" fill="#ff4586"><animate attributeName="r" values="0;5;0" dur="2.6s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0;.9" dur="2.6s" begin="1.6s" repeatCount="indefinite"/></circle></svg>

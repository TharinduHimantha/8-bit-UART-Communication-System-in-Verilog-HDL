<style>text{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono',monospace}</style></defs><rect x="10" y="14" width="200" height="122" rx="10" fill="#0b1730" stroke="#00d4ff" stroke-width="1.4" stroke-opacity="0.7" /><rect x="10" y="14" width="200" height="122" rx="10" fill="#00d4ff" fill-opacity="0.05" /><rect x="20" y="12.5" width="46" height="3" rx="1.5" fill="#00d4ff" filter="url(#glow)"><animate attributeName="x" values="20;154;20" dur="4.0s" repeatCount="indefinite"/></rect><text x="110.0" y="70" font-size="38" fill="#00d4ff" text-anchor="middle" font-weight="bold" filter="url(#glow)">16×8</text><text x="110.0" y="96" font-size="13" fill="#d6e4ff" text-anchor="middle" font-weight="bold" >TX / RX FIFO</text><text x="110.0" y="116" font-size="10.5" fill="#7f93b8" text-anchor="middle" font-weight="normal" >first-word-fall-through</text><circle cx="26" cy="124" r="0" fill="#00d4ff"><animate attributeName="r" values="0;5;0" dur="2.6s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0;.9" dur="2.6s" begin="0.0s" repeatCount="indefinite"/></circle><rect x="230" y="14" width="200" height="122" rx="10" fill="#0b1730" stroke="#a066ff" stroke-width="1.4" stroke-opacity="0.7" /><rect x="230" y="14" width="200" height="122" rx="10" fill="#a066ff" fill-opacity="0.05" /><rect x="240" y="12.5" width="46" height="3" rx="1.5" fill="#a066ff" filter="url(#glow)"><animate attributeName="x" values="240;374;240" dur="4.6s" repeatCount="indefinite"/></rect><text x="330.0" y="70" font-size="38" fill="#a066ff" text-anchor="middle" font-weight="bold" filter="url(#glow)">9</text><text x="330.0" y="96" font-size="13" fill="#d6e4ff" text-anchor="middle" font-weight="bold" >REGISTERS</text><text x="330.0" y="116" font-size="10.5" fill="#7f93b8" text-anchor="middle" font-weight="normal" >0x00 – 0x20 · 32-bit bus</text><circle cx="246" cy="124" r="0" fill="#a066ff"><animate attributeName="r" values="0;5;0" dur="2.6s" begin
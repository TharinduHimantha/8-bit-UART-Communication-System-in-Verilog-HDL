<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-labelledby="ttl dsc"><title id="ttl">RX latency breakdown</title><desc id="dsc">Stacked bar showing receive latency of 4125 clock cycles: 2 synchroniser cycles, a half bit, 8 data bit centres and a stop bit centre, about 82.5 microseconds at 50 MHz.</desc><defs><marker id="ar-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#00d4ff"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2ee59d"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ff4586"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a066ff"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ff8a00"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ff3b5c"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#36d9d6"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ffb020"/></marker><marker id="ar-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7f93b8"/></marker>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#10203d" stroke-width="1"/></pattern>
<linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050912"/><stop offset="1" stop-color="#0a1428"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>text{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono',monospace}</style></defs><rect width="1100" height="330" rx="14" fill="url(#bgg)"/><rect width="1100" height="330" rx="14" fill="url(#grid)" opacity=".55"/><rect x=".75" y=".75" width="1098.5" height="328.5" rx="13.5" fill="none" stroke="#1d3a66" stroke-width="1.5"/><text x="24" y="30" font-size="15" fill="#36d9d6" text-anchor="start" font-weight="bold" letter-spacing="1">RX LATENCY  ·  start-bit edge → byte in RX FIFO</text><text x="1076" y="30" font-size="11" fill="#7f93b8" text-anchor="end" font-weight="normal" >50 MHz · 115200 baud · 8-N-1 · CLKS_PER_BIT = 434</text><g clip-path="url(#lat)" filter="url(#glow)"><rect x="60.0" y="120" width="5.0" height="64" fill="#36d9d6" fill-opacity="0.5" stroke="#36d9d6" stroke-width="1.2"/><rect x="65.0" y="120" width="49.0" height="64" fill="#00d4ff" fill-opacity="0.28" stroke="#00d4ff" stroke-width="1.2"/><text x="89.5" y="150" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >½ bit</text><text x="89.5" y="168" font-size="10.5" fill="#00d4ff" text-anchor="middle" font-weight="normal" >217</text><rect x="114.0" y="120" width="98.0" height="64" fill="#2ee59d" fill-opacity="0.5" stroke="#2ee59d" stroke-width="1.2"/><text x="163.0" y="150" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >d0</text><text x="163.0" y="168" font-size="10.5" fill="#2ee59d" text-anchor="middle" font-weight="normal" >434</text><rect x="212.0" y="120" width="98.0" height="64" fill="#2ee59d" fill-opacity="0.28" stroke="#2ee59d" stroke-width="1.2"/><text x="261.0" y="150" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >d1</text><text x="261.0" y="168" font-size="10.5" fill="#2ee59d" text-anchor="middle" font-weight="normal" >434</text><rect x="310.0" y="120" width="98.0" height="64" fill="#2ee59d" fill-opacity="0.5" stroke="#2ee59d" stroke-width="1.2"/><text x="359.0" y="150" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >d2</text><text x="359.0" y="168" font-size="10.5" fill="#2ee59d" text-anchor="middle" font-weight="normal" >434</text><rect x="408.0" y="120" width="98.0" height="64" fill="#2ee59d" fill-opacity="0.28" stroke="#2ee59d" stroke-width="1.2"/><text x="457.0" y="150" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >d3</text><text x="457.0" y="168" font-size="10.5" fill="#2ee59d" text-anchor="middle" font-weight="normal" >434</text><rect x="506.0" y="120" width="98.0" height="64" fill="#2ee59d" fill-opacity="0.5" stroke="#2ee59d" stroke-width="1.2"/><text x="555.0" y="150" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >d4</text><text x="555.0" y="168" font-size="10.5" fill="#2ee59d" text-anchor="middle" font-weight="normal" >434</text><rect x="604.0" y="120" width="98.0" height="64" fill="#2ee59d" fill-opacity="0.28" stroke="#2ee59d" stroke-width="1.2"/><text x="653.0" y="150" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >d5</text><text x="653.0" y="168" font-size="10.5" fill="#2ee59d" text-anchor="middle" font-weight="normal" >434</text><rect x="702.0" y="120" width="98.0" height="64" fill="#2ee59d" fill-opacity="0.5" stroke="#2ee59d" stroke-width="1.2"/><text x="751.0" y="150" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >d6</text><text x="751.0" y="168" font-size="10.5" fill="#2ee59d" text-anchor="middle" font-weight="normal" >434</text><rect x="800.0" y="120" width="98.0" height="64" fill="#2ee59d" fill-opacity="0.28" stroke="#2ee59d" stroke-width="1.2"/><text x="849.0" y="150" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >d7</text><text x="849.0" y="168" font-size="10.5" fill="#2ee59d" text-anchor="middle" font-weight="normal" >434</text><rect x="898.0" y="120" width="98.0" height="64" fill="#4d8dff" fill-opacity="0.5" stroke="#4d8dff" stroke-width="1.2"/><text x="947.0" y="150" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >stop</text><text x="947.0" y="168" font-size="10.5" fill="#4d8dff" text-anchor="middle" font-weight="normal" >434</text></g><clipPath id="lat"><rect x="56" y="80" width="0" height="140"><animate attributeName="width" values="0;941;941" keyTimes="0;.7;1" dur="9s" repeatCount="indefinite"/></rect></clipPath><rect x="56" y="84" width="2.4" height="132" fill="#00d4ff" filter="url(#glow)"><animate attributeName="x" values="56;996.0;996.0" keyTimes="0;.7;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.7;.73;1" dur="9s" repeatCount="indefinite"/></rect><text x="63" y="108" font-size="10" fill="#36d9d6" text-anchor="start" font-weight="normal" >2-FF sync (2)</text><path d="M60,90 V120" stroke="#ff4586" stroke-width="2" marker-end="url(#ar-pink)"/><text x="60" y="72" font-size="11.5" fill="#ff4586" text-anchor="start" font-weight="bold" >▼ falling edge of start bit</text><path d="M996.0,214 V184" stroke="#2ee59d" stroke-width="2" marker-end="url(#ar-green)"/><text x="996.0" y="232" font-size="11.5" fill="#2ee59d" text-anchor="end" font-weight="bold" >rx_valid · byte visible to RX_AVAILABLE / DATA read</text><path d="M1040.0,100 V198" stroke="#7f93b8" stroke-width="1.2" stroke-dasharray="4 4"/><text x="1040.0" y="94" font-size="10" fill="#7f93b8" text-anchor="end" font-weight="normal" >full 10-bit frame ends: 4340 cycles · 86.8 µs</text><g opacity="0"><text x="550.0" y="268" font-size="20" fill="#36d9d6" text-anchor="middle" font-weight="bold" filter="url(#glow)">4125 cycles  =  2 + 217 + 434 × 9  ≈  82.5 µs</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.7400;0.9800;1.0000" dur="9s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></g><text x="550.0" y="306" font-size="10.5" fill="#7f93b8" text-anchor="middle" font-weight="normal" >latency = ~2 + CLKS_PER_BIT/2 + CLKS_PER_BIT × (8 + parity_bits + stop_bits)   — slightly under one frame thanks to the half-bit head start</text></svg>
